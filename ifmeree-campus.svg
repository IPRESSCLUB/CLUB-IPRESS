<svg xmlns="http://www.w3.org/2000/svg" class="ifm-architectural-svg ifm-campus-svg" data-artwork="campus" viewBox="0 0 1616 973" role="img" aria-labelledby="campus-title campus-desc">
<title id="campus-title">Le campus de l’IFMEREE Tanger, du trait à la matière</title><desc id="campus-desc">Allée, palmiers, façades et enseigne en noir et blanc. Un cercle vert apparaît derrière les bâtiments pendant la révélation des ombres.</desc>
<defs>
<filter id="campus-edge-grain" filterUnits="userSpaceOnUse" x="-90" y="-110" width="1796" height="320" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency=".035 .05" numOctaves="3" seed="5" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="44" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="1.2"/>
<feComponentTransfer><feFuncA type="linear" slope="4" intercept="-1.4"/></feComponentTransfer>
</filter>
<mask id="campus-ink-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1616" height="973" style="mask-type:luminance">
<g class="ifm-develop-front" transform="translate(0 1200)">
<path d="M-90 -1600H1706V-45H-90Z" fill="#fff"/>
<path d="M-90 -85H1706V0Q808 200 -90 0Z" fill="#fff" filter="url(#campus-edge-grain)"/>
</g></mask>
</defs>
<g mask="url(#campus-ink-mask)"><circle class="ifm-architectural-circle" cx="1050" cy="284" r="255" fill="#B8DD70"/></g>
<image href="ifmeree-campus-outline.png" width="1616" height="973"/>
<image href="ifmeree-campus-shaded.png" width="1616" height="973" mask="url(#campus-ink-mask)"/>
</svg>